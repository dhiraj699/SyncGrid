services:
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: [mongo-data:/data/db]

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      - NODE_ENV=production
      - PORT=4000
      - STORE_DRIVER=mongo
      - MONGODB_URI=mongodb://mongo:27017/syncgrid
      - JWT_SECRET=${JWT_SECRET:-}
      - DEMO_PASSWORD=${DEMO_PASSWORD:-}
    depends_on:
      - mongo

  nginx:
    image: nginx:alpine
    ports:
      - "4000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend

volumes:
  mongo-data:
